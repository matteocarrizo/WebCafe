<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogDeCafe</title>
    <link rel="stylesheet" href="/css/normalize.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=PT+Sans:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="header">

        <div class="contenedor">
            <div class="barra">
                <a href="index.html" class="logo">
                    <h1 class="logo__nombre no-margin centrar-texto">Blog <span class="logo__bold">DeCafé</span></h1>
                </a>

                <nav class="navegacion">
                    <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>
                    <a href="cursos.html" class="navegacion__enlace">Cursos</a>
                    <a href="contacto.html" class="navegacion__enlace">Contacto</a>
                </nav>
            </div>
        </div>

        <div class="header__texto">
            <h2 class="no-margin"> Blog de cafe con consejos y cursos</h2>
            <p class="no-margin"> Aprende de los expertos con las mejores recetas y consejos</p>
        </div>
    </header>

    <main class="contenedor">
        <h3 class="centrar-texto">Contacto</h3>
        
        <div class="contaco-bg"></div>

<form class="formulario" id="form-contacto" novalidate>

  <div class="campo">
    <label class="campo__label" for="nombre">Nombre</label>
    <input class="campo__field" type="text" id="nombre" name="nombre"
           placeholder="Tu nombre" autocomplete="name"
           required minlength="2" maxlength="60">
    <span class="campo__error" aria-live="polite"></span>
  </div>

  <div class="campo">
    <label class="campo__label" for="email">E-mail</label>
    <input class="campo__field" type="email" id="email" name="email"
           placeholder="tuemail@ejemplo.com" autocomplete="email"
           required>
    <span class="campo__error" aria-live="polite"></span>
  </div>

  <div class="campo">
    <label class="campo__label" for="asunto">Asunto</label>
    <select class="campo__field" id="asunto" name="asunto" required>
      <option value="" disabled selected>Elegí una opción</option>
      <option value="consulta">Consulta general</option>
      <option value="cursos">Consulta sobre cursos</option>
      <option value="colaboracion">Colaboración</option>
      <option value="otro">Otro</option>
    </select>
    <span class="campo__error" aria-live="polite"></span>
  </div>

  <div class="campo">
    <label class="campo__label" for="mensaje">Mensaje</label>
    <textarea class="campo__field" id="mensaje" name="mensaje" rows="6"
              placeholder="Contanos en qué te podemos ayudar"
              required minlength="10" maxlength="1000"></textarea>
    <span class="campo__error" aria-live="polite"></span>
  </div>

  <div class="campo">
    <input type="submit" value="Enviar" class="boton boton--primario">
  </div>

  <p class="formulario__estado" id="estado" role="status" aria-live="polite"></p>
</form>
       
    </main>

    <footer class="footer">

        <div class="contenedor">
            <div class="barra">
                <a href="index.html" class="logo">
                    <h1 class="logo__nombre no-margin centrar-texto">Blog <span class="logo__bold">DeCafé</span></h1>
                </a>

                <nav class="navegacion">
                    <a href="nosotro.html" class="navegacion__enlace">Nosotros</a>
                    <a href="cursos.html" class="navegacion__enlace">Cursos</a>
                    <a href="contacto.html" class="navegacion__enlace">Contacto</a>
                </nav>
            </div>
        </div>

    </footer>

</body>

</html>
